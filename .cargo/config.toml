# Windows MSVC debug defaults to a 1MB stack; clap's Command tree overflows it
# (`hstry --help` → STATUS_STACK_OVERFLOW). Linux/macOS are unchanged.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]
